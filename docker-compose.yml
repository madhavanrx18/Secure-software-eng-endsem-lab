version: '3.8'

services:
  postgres:
    image: postgres:13-alpine
    container_name: voting-postgres
    environment:
      POSTGRES_USER: voting_user
      POSTGRES_PASSWORD: voting_pass
      POSTGRES_DB: voting_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - voting-network

  voting-api:
    build: .
    container_name: voting-api
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://voting_user:voting_pass@postgres:5432/voting_db
      SECRET_KEY: your-secret-key-change-in-production
      JWT_SECRET_KEY: jwt-secret-key-change-in-production
    depends_on:
      - postgres
    networks:
      - voting-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  voting-network:
    driver: bridge